name: Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package web game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game JavaScript and PWA files
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('No inline game script found');
          for (const [index, match] of scripts.entries()) {
            new Function(match[1]);
            console.log('Inline script ' + (index + 1) + ' syntax OK');
          }
          for (const file of ['www/manifest.webmanifest', 'www/sw.js', 'www/icon.svg']) {
            if (!fs.existsSync(file)) throw new Error('Missing web app file: ' + file);
          }
          JSON.parse(fs.readFileSync('www/manifest.webmanifest', 'utf8'));
          console.log('PWA assets and manifest OK');
          NODE
      - name: Prepare web package
        run: |
          mkdir -p site
          cp www/index.html www/manifest.webmanifest www/sw.js www/icon.svg site/
          touch site/.nojekyll
      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: trading-game-web
          path: site
          if-no-files-found: error
          retention-days: 30
